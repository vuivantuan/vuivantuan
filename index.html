    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(180deg, #71b1ea 0%, #b3daf6 40%, #cbe3f7 100%);
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            position: relative;
        }
        .name-font {
            font-family: 'Dancing Script', cursive;
        }
        
        .city-bg {
            background-image: url('https://images.unsplash.com/photo-1519501025264-65ba15a82390?q=80&w=1000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            opacity: 0.35;
        }
        .forest-bg {
            background-image: url('https://images.unsplash.com/photo-1448375240586-882707db888b?q=80&w=1000&auto=format&fit=crop');
            background-size: cover;
            background-position: center bottom;
            opacity: 0.35;
        }

        .bio-btn {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1.5px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 20px rgba(31, 38, 135, 0.12), inset 0 0 0 1px rgba(255, 255, 255, 0.5);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .bio-btn:hover {
            transform: translateY(-4px) scale(1.01);
            background: rgba(255, 255, 255, 0.92);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.18);
        }

        .icon-box {
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
    </style>
</head>
