        /* Hiệu ứng nền ngọn núi chuẩn Template F23 */

            background-position: center bottom;
            opacity: 0.25;
        }

        /* Nút bấm dải màu Gradient chuẩn mẫu gốc Code Pro */
        .btn-facebook {
            background: linear-gradient(90deg, #254d8c 0%, #3b5998 100%);
        }
        .btn-tiktok {
            background: linear-gradient(90deg, #111111 0%, #690518 100%);
        }
        .btn-telegram {

        .btn-messenger {

        .btn-zalo {
            background: linear-gradient(90deg, #0068ff 0%, #0099ff 100%);
        }
        .btn-phone {
            background: linear-gradient(90deg, #2c3040 0%, #68718e 100%);
        }
        .btn-momo {
            background: linear-gradient(90deg, #a50064 0%, #d82d8b 100%);
        }
        .btn-agribank {
            background: linear-gradient(90deg, #006633 0%, #c1272d 100%);
        }
        .btn-mbbank {
            background: linear-gradient(90deg, #120078 0%, #0044cc 100%);
        }

        /* Hiệu ứng đổ bóng chuẩn */
        .btn-style {
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
            transition: all 0.3s ease;
        }
        .btn-style:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 22px rgba(0, 0, 0, 0.35);
        }
